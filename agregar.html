<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/static/logo_A.png">
<title>Agregar Producto · Catálogo</title>
<style>
  :root { --bg:#0f0f0f; --surface:#1a1a1a; --card:#242424; --border:#333; --text:#f0f0f0; --muted:#888; --accent:#C8A24A; --accent-dim:#a07830; --ok:#22c55e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header h1 { font-size: 18px; color: var(--accent); }
  .header-nav { display: flex; gap: 12px; }
  .header-nav a { color: var(--muted); text-decoration: none; font-size: 13px; padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; }
  .header-nav a:hover { color: var(--text); border-color: var(--accent); }

  .content { max-width: 700px; margin: 24px auto; padding: 0 20px 60px; }

  .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px; }
  .form-card h2 { font-size: 16px; color: var(--accent); margin-bottom: 20px; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 500px) { .row { grid-template-columns: 1fr; } }

  label { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; font-size: 12px; color: var(--muted); }
  label.span2 { grid-column: span 2; }
  input, select, textarea { padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text); font: inherit; font-size: 14px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; min-height: 60px; }

  .file-area { border: 2px dashed var(--border); border-radius: 10px; padding: 24px; text-align: center; cursor: pointer; transition: all .2s; position: relative; }
  .file-area:hover { border-color: var(--accent); }
  .file-area input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .file-area .icon { font-size: 28px; margin-bottom: 6px; }
  .file-area .txt { font-size: 13px; color: var(--muted); }
  .file-area .txt span { color: var(--accent); font-weight: 600; }
  .preview { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }

  .actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn { padding: 10px 20px; border: none; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover { background: var(--accent-dim); }
  .btn-secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-secondary:hover { color: var(--text); border-color: var(--accent); }

  .flash { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
  .flash.ok { background: #166534; color: #fff; }
  .flash.warn { background: #78350f; color: #fbbf24; }

  .counter { font-size: 12px; color: var(--muted); text-align: right; margin-top: 4px; }
</style>
</head>
<body>

<div class="header">
  <h1>➕ Agregar Producto</h1>
  <div class="header-nav">
    <a href="{{ url_for('catalogo') }}">📚 Catálogo</a>
    <a href="{{ url_for('logout') }}">🚪 Salir</a>
  </div>
</div>

<div class="content">
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ cat }}">{{ msg }}</div>
  {% endfor %}

  <div class="form-card">
    <h2>Nuevo producto</h2>
    <form method="post" enctype="multipart/form-data" id="form">
      <div class="row">
        <label>Marca *
          <input list="brands-list" name="brand" value="{{ form.get('brand', '') }}" placeholder="Casio, Tommy, Tissot..." required>
          <datalist id="brands-list">
            {% for b in brands %}<option value="{{ b }}">{% endfor %}
            <option value="Joyería Domínguez (Relojes)">
            <option value="Joyería Domínguez (Joyería)">
            <option value="Joyería Domínguez (Accesorios)">
          </datalist>
        </label>
        <label>Referencia *
          <input type="text" name="reference" value="{{ form.get('reference', '') }}" placeholder="GA-2100-1A" required>
        </label>
      </div>

      <label>Nombre del producto
        <input type="text" name="name" value="{{ form.get('name', '') }}" placeholder="Reloj Casio Caballero G-Shock">
      </label>

      <div class="row">
        <label>Línea / Ubicación
          <input list="lines-list" name="line" value="{{ form.get('line', '') }}" placeholder="G-Shock, Baby-G, Edifice...">
          <datalist id="lines-list">
            <option value="G-Shock"><option value="Baby-G"><option value="Edifice">
            <option value="Protrek"><option value="Vintage"><option value="Classic">
            <option value="Sheen"><option value="MTP"><option value="LTP">
            <option value="Anillos Oro"><option value="Anillos Oro Blanco 18k">
            <option value="Platería"><option value="Alpaca"><option value="Plata 925">
            <option value="Dijes"><option value="Medallas"><option value="Aros">
            <option value="Bolígrafos Parker"><option value="Nombres Personalizados">
            <option value="General">
          </datalist>
        </label>
        <label>Género
          <select name="gender">
            <option value="">Sin definir</option>
            <option value="Hombre" {{ 'selected' if form.get('gender')=='Hombre' }}>Hombre</option>
            <option value="Dama" {{ 'selected' if form.get('gender')=='Dama' }}>Dama</option>
            <option value="Unisex" {{ 'selected' if form.get('gender')=='Unisex' }}>Unisex</option>
          </select>
        </label>
      </div>

      <label>Descripción
        <textarea name="description" placeholder="Descripción breve del producto...">{{ form.get('description', '') }}</textarea>
      </label>

      <div class="row">
        <label>Precio origen (USD)
          <input type="number" name="price" step="0.01" placeholder="0.00">
        </label>
        <label>Precio de venta (Gs.)
          <input type="number" name="sell_price" step="1000" placeholder="0">
        </label>
      </div>

      <label>URL de origen (opcional)
        <input type="url" name="url" placeholder="https://tienda.com/producto/...">
      </label>

      <label>Fotos del producto
        <div class="file-area" id="drop-zone">
          <div class="icon">📷</div>
          <div class="txt">Arrastrá fotos aquí o <span>hacé clic para seleccionar</span></div>
          <div class="txt">Podés subir varias a la vez</div>
          <input type="file" name="images" id="file-input" multiple accept="image/*">
        </div>
        <div class="preview" id="preview"></div>
      </label>

      <div class="actions">
        <button type="submit" class="btn btn-primary">💾 Guardar producto</button>
        <a href="{{ url_for('catalogo') }}" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>

<script>
  const fileInput = document.getElementById('file-input');
  const preview = document.getElementById('preview');
  fileInput.addEventListener('change', () => {
    preview.innerHTML = '';
    [...fileInput.files].forEach(f => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = document.createElement('img');
        img.src = e.target.result;
        preview.appendChild(img);
      };
      reader.readAsDataURL(f);
    });
  });
</script>
</body>
</html>
