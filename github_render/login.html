<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar Sesión · Catálogo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f0f0f; color: #f0f0f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-box { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 40px; width: 90%; max-width: 380px; }
  .login-box h1 { font-size: 22px; color: #C8A24A; margin-bottom: 6px; }
  .login-box p { font-size: 13px; color: #888; margin-bottom: 24px; }
  .login-box label { display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px; font-size: 12px; color: #888; }
  .login-box input { padding: 10px 12px; border: 1px solid #333; border-radius: 8px; background: #242424; color: #f0f0f0; font: inherit; font-size: 14px; }
  .login-box input:focus { outline: none; border-color: #C8A24A; }
  .login-box button { width: 100%; padding: 10px; border: none; border-radius: 8px; background: #C8A24A; color: #000; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 4px; }
  .login-box button:hover { background: #a07830; }
  .error { background: #2a1215; color: #f87171; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
  .link { text-align: center; margin-top: 16px; }
  .link a { color: #C8A24A; font-size: 13px; text-decoration: none; }
</style>
</head>
<body>
<div class="login-box">
  <h1>🔐 Acceso</h1>
  <p>Ingresá para agregar y editar productos</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post">
    <label>Email
      <input type="email" name="email" placeholder="tu@email.com" required autofocus>
    </label>
    <label>Contraseña
      <input type="password" name="password" placeholder="••••••" required>
    </label>
    <button type="submit">Ingresar</button>
  </form>
  <div class="link"><a href="{{ url_for('catalogo') }}">← Volver al catálogo (sin login)</a></div>
</div>
</body>
</html>
